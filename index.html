<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM Science Incentive</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="wrap head">
    <h1>MM Science Incentive</h1>
    <div class="updated" id="updated"></div>
  </div>
</header>
<main class="wrap">
  <div class="controls">
    <div class="seg" id="roleSeg">
      <button data-role="attempters" class="on">Attempters</button>
      <button data-role="reviewers">Reviewers</button>
    </div>
    <div class="seg" id="weekSeg" hidden>
      <button data-week="this_week" class="on">Week 1</button>
      <button data-week="next_week">Week 2</button>
    </div>
    <input id="search" type="search" placeholder="User ID">
  </div>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th data-k="user_id">User ID</th>
          <th data-k="acceptance_pct" class="num">Acceptance %</th>
          <th data-k="aht" class="num">AHT</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="empty" id="empty" hidden>No data</p>
</main>
<script src="/app.js"></script>
</body>
</html>
