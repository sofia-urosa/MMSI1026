<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM Science Incentive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Zilla+Slab:ital,wght@1,500&display=swap">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <span class="logo" role="img" aria-label="Workada"></span>
      <h1>MM Science Incentive</h1>
      <p class="sub">Oct 27, 12:00 AM – Nov 1, 11:59 PM ET</p>
    </div>
    <div class="updated" id="updated"></div>
  </div>
</header>
<main class="wrap">
  <div class="controls">
    <div class="seg" id="roleSeg">
      <button data-role="attempters" class="on">Attempters</button>
      <button data-role="reviewers">Reviewers</button>
    </div>
    <div class="seg" id="weekSeg" hidden>
      <button data-week="this_week" class="on">Week 1</button>
      <button data-week="next_week">Week 2</button>
    </div>
    <input id="search" type="search" placeholder="User ID">
  </div>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th data-k="user_id">User ID</th>
          <th data-k="accepted" class="num">Accepted</th>
          <th data-k="acceptance_pct" class="num">Acceptance %</th>
          <th data-k="aht" class="num">AHT</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="empty" id="empty" hidden>No data</p>
  <p class="note"><span class="dot" aria-hidden="true"></span>The incentive applies to your first 25 accepted tasks. Tasks past 25 still count toward your acceptance % and are paid at your normal base rate, so keep going!</p>
</main>
<script src="/app.js"></script>
</body>
</html>
